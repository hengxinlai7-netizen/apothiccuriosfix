plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }

def mod_name = "神化饰品修复 + 神化铁魔法 / ApothicCurios Fix + Iron's Apothic"
def mod_authors = 'hengx'
def mod_description = "ApothicCurios Fix (curios:* loot categories + curio affix attributes + tooltip cleanup) merged with the Iron's Apothic port (school power / mana cost affixes). The Iron's Apothic module only initializes when Iron's Spellbooks is installed."

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}

repositories {
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly files('libs/Apotheosis-1.20.1-7.4.8.jar')
    compileOnly files('libs/Placebo-1.20.1-8.6.3.jar')
    compileOnly files('libs/ApothicAttributes-1.20.1-1.3.7.jar')
    compileOnly files('libs/curios-forge-5.14.1+1.20.1.jar')
    // Not needed at runtime: this mod is a standalone replacement for the "curios:*" categories
    // ApothicCurios registers lazily. Compile-only so that nothing links against it.
    compileOnly files('libs/ApothicCurios-1.20.1-1.0.3e-optimized.jar')
    // 神化铁魔法(irons_apothic)模块:仅编译期,运行期靠 ModList 门控 + 守卫
    compileOnly files('libs/[Iron的法术与魔法书] irons_spellbooks-1.20.1-3.15.4.jar')
    compileOnly files('libs/geckolib-forge-1.20.1-4.8.4.jar')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : '[1.20.1,1.20.2)',
            forge_version            : forge_version,
            forge_version_range      : '[47.2.0,)',
            loader_version_range     : '[47,)',
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : 'MIT',
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(resourceTargets) { expand replaceProperties }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // 1.20.1 Forge discovers mixin configs through this manifest attribute.
                'MixinConfigs'            : 'apothiccuriosfix.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}
